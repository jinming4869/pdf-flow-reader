<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">航迹：从自由套索到情绪坐标</title>
  <desc id="desc">左侧是一张被丝带墨线圈选的纸页，轨迹穿过中间，连接到右侧效价与唤醒连续坐标中的多个阅读时刻。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ec"/>
      <stop offset="0.52" stop-color="#edf1ea"/>
      <stop offset="1" stop-color="#e4ece7"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c96f54"/>
      <stop offset="0.45" stop-color="#d99d72"/>
      <stop offset="1" stop-color="#557763"/>
    </linearGradient>
    <radialGradient id="warmPoint">
      <stop offset="0" stop-color="#f4d8b6"/>
      <stop offset="0.56" stop-color="#d57b59"/>
      <stop offset="1" stop-color="#b85742"/>
    </radialGradient>
    <filter id="paperShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#20372d" flood-opacity="0.15"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="paperGrain" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="7" r="0.7" fill="#8c7960" opacity="0.12"/>
      <circle cx="14" cy="4" r="0.5" fill="#718274" opacity="0.10"/>
      <circle cx="10" cy="15" r="0.6" fill="#8c7960" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" rx="38" fill="url(#background)"/>
  <path d="M0 474 C215 408 388 546 608 476 S1018 348 1280 424 L1280 640 L0 640 Z" fill="#dce6df" opacity="0.62"/>
  <path d="M0 512 C210 452 376 590 614 518 S1034 391 1280 470" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>

  <text x="72" y="72" fill="#24362d" font-size="30" font-family="ui-serif, 'Songti SC', 'Noto Serif CJK SC', serif" font-weight="600">有一句话，让书页停了下来</text>
  <text x="72" y="108" fill="#65746b" font-size="17" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="1.2">圈住的不是知识点，而是一次真实的触动</text>

  <g filter="url(#paperShadow)">
    <path d="M84 152 Q86 134 106 134 H476 Q496 136 494 156 L473 512 Q471 529 452 528 L104 520 Q86 519 87 500 Z" fill="#fffdf7"/>
    <path d="M84 152 Q86 134 106 134 H476 Q496 136 494 156 L473 512 Q471 529 452 528 L104 520 Q86 519 87 500 Z" fill="url(#paperGrain)"/>
  </g>

  <text x="122" y="190" fill="#6d776f" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="2.4">CHAPTER 04 · THE LIVING PAGE</text>
  <rect x="122" y="218" width="252" height="9" rx="4.5" fill="#34473d" opacity="0.82"/>
  <rect x="122" y="242" width="306" height="7" rx="3.5" fill="#829087" opacity="0.52"/>
  <rect x="122" y="261" width="282" height="7" rx="3.5" fill="#829087" opacity="0.42"/>
  <rect x="122" y="280" width="318" height="7" rx="3.5" fill="#829087" opacity="0.42"/>
  <rect x="122" y="299" width="224" height="7" rx="3.5" fill="#829087" opacity="0.42"/>
  <rect x="122" y="337" width="315" height="7" rx="3.5" fill="#829087" opacity="0.42"/>
  <rect x="122" y="356" width="280" height="7" rx="3.5" fill="#829087" opacity="0.42"/>
  <rect x="122" y="375" width="304" height="7" rx="3.5" fill="#829087" opacity="0.42"/>
  <rect x="122" y="394" width="196" height="7" rx="3.5" fill="#829087" opacity="0.42"/>
  <rect x="122" y="432" width="244" height="7" rx="3.5" fill="#829087" opacity="0.42"/>
  <rect x="122" y="451" width="294" height="7" rx="3.5" fill="#829087" opacity="0.42"/>
  <rect x="122" y="470" width="208" height="7" rx="3.5" fill="#829087" opacity="0.42"/>

  <path d="M105 322 C126 301 199 301 253 309 C324 319 389 300 431 322 C462 339 457 382 432 406 C398 438 305 427 238 423 C170 420 111 427 93 393 C81 370 84 343 105 322 Z" fill="#d7805f" opacity="0.09"/>
  <path d="M105 322 C126 301 199 301 253 309 C324 319 389 300 431 322 C462 339 457 382 432 406 C398 438 305 427 238 423 C170 420 111 427 93 393 C81 370 84 343 105 322 Z" fill="none" stroke="#c76543" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M101 323 C79 311 65 293 72 278 C82 259 111 271 110 292 C109 311 90 329 74 338" fill="none" stroke="#c76543" stroke-width="7" stroke-linecap="round"/>
  <circle cx="73" cy="339" r="8" fill="#c76543"/>

  <path d="M451 379 C525 390 512 473 573 468 C633 463 611 348 678 354 C745 360 730 478 804 458" fill="none" stroke="url(#ribbon)" stroke-width="8" stroke-linecap="round"/>
  <path d="M451 379 C525 390 512 473 573 468 C633 463 611 348 678 354 C745 360 730 478 804 458" fill="none" stroke="#fffdf7" stroke-width="2" stroke-linecap="round" opacity="0.52"/>
  <circle cx="574" cy="468" r="7" fill="#d48b66"/>
  <circle cx="678" cy="354" r="7" fill="#9a8065"/>

  <g transform="translate(760 134)">
    <rect width="448" height="394" rx="26" fill="#fffdf8" opacity="0.94" filter="url(#paperShadow)"/>
    <text x="32" y="48" fill="#24362d" font-size="21" font-family="ui-serif, 'Songti SC', 'Noto Serif CJK SC', serif" font-weight="600">这本书怎样经过我</text>
    <text x="32" y="76" fill="#718078" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="1">CONTINUOUS EMOTIONAL TRAJECTORY</text>

    <line x1="62" y1="224" x2="406" y2="224" stroke="#7c8c83" stroke-width="1.5" opacity="0.62"/>
    <line x1="234" y1="104" x2="234" y2="344" stroke="#7c8c83" stroke-width="1.5" opacity="0.62"/>
    <path d="M402 220 L411 224 L402 228" fill="none" stroke="#7c8c83" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M230 109 L234 100 L238 109" fill="none" stroke="#7c8c83" stroke-width="1.5" stroke-linecap="round"/>

    <text x="46" y="249" fill="#7a8780" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">负面效价</text>
    <text x="354" y="249" fill="#7a8780" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">正面效价</text>
    <text x="246" y="112" fill="#7a8780" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">高唤醒</text>
    <text x="246" y="272" fill="#7a8780" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">低唤醒</text>

    <path d="M121 179 C167 126 199 164 267 145 S345 190 375 128" fill="none" stroke="#557763" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.66"/>
    <path d="M121 179 C167 126 199 164 267 145 S345 190 375 128" fill="none" stroke="#f4eee2" stroke-width="1.3" stroke-linecap="round" opacity="0.75"/>

    <circle cx="121" cy="179" r="10" fill="#6d8877" stroke="#fffdf8" stroke-width="4"/>
    <circle cx="181" cy="143" r="12" fill="#a88367" stroke="#fffdf8" stroke-width="4"/>
    <circle cx="267" cy="145" r="10" fill="#78907e" stroke="#fffdf8" stroke-width="4"/>
    <circle cx="326" cy="164" r="12" fill="#c77858" stroke="#fffdf8" stroke-width="4"/>
    <circle cx="375" cy="128" r="16" fill="url(#warmPoint)" stroke="#fffdf8" stroke-width="5" filter="url(#softGlow)"/>

    <rect x="94" y="294" width="260" height="54" rx="18" fill="#eef2ed"/>
    <circle cx="120" cy="321" r="7" fill="#c76543"/>
    <text x="140" y="317" fill="#34473d" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif">第 127 页 · 高唤醒 / 正向</text>
    <text x="140" y="336" fill="#738078" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">“这里，论证忽然有了人的温度。”</text>
  </g>

  <g transform="translate(474 548)">
    <rect width="340" height="52" rx="26" fill="#24362d" opacity="0.94"/>
    <text x="170" y="33" text-anchor="middle" fill="#fffaf0" font-size="16" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="2">圈住一瞬 · 留下一点 · 回到书流</text>
  </g>
</svg>
