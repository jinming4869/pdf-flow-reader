[project]
name = "pdf-flow-reader-multilingual-tts-poc"
version = "0.1.0"
description = "Isolated Kokoro ONNX and Misaki feasibility test for PDF Flow Reader"
requires-python = ">=3.12,<3.13"
dependencies = [
  "kokoro-onnx==0.5.0",
  "misaki-fork[ja,zh]==0.9.6",
  "psutil==7.0.0",
  "soundfile==0.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tts_poc"]

[dependency-groups]
dev = [
  "pytest==8.4.1",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
